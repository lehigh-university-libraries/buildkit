server {
    listen 80 default_server;
    server_name scalar.lehigh.edu;
    root /opt/scalar;
    index codeigniter.php;
    access_log /dev/stdout combined;
    error_log /dev/stderr;

    if ($http_user_agent ~* "SemrushBot|DotBot|YandexBot") { return 403; }

    include /etc/nginx/shared/fpm.conf;

    location ~ /\. { return 404; }
    location ~* \.(?:sql|gz|zip|tar|tgz|bak|backup|old|orig|save|swp|patch|diff|log|ini|env)(?:/|$)|~$ { return 404; }
    location ~* ^/system(?:-v[^/]+)?/application/config(?:/|$) { return 404; }

    location ~ ^/codeigniter\.php(?:/|$) {
        fastcgi_split_path_info ^(.+?\.php)(/.*)$;
        if (!-f $document_root$fastcgi_script_name) { return 404; }
        fastcgi_pass unix:/run/php-fpm/php-fpm.sock;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_SCHEME https;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        include fastcgi_params;
    }
    # Unknown PHP entry points must be audited before explicitly allowing them.
    location ~ \.php(?:/|$) { return 404; }

    # Match the checked-in .htaccess: root files other than the front
    # controller and maintenance page are not public; book slugs still route.
    location = /maintenance.html { try_files $uri =404; }
    location ~ ^/[^/]+$ {
        if (-f $request_filename) { return 404; }
        rewrite ^/(.*)$ /codeigniter.php/$1 last;
    }

    location / {
        if (-d $request_filename) { rewrite ^/(.*)$ /codeigniter.php/$1 last; }
        try_files $uri /codeigniter.php$uri$is_args$args;
    }
}
