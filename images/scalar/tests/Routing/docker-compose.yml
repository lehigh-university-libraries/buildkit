name: scalar-routing
services:
  scalar:
    image: ${SCALAR:-lehighlts/scalar:local-php84}
    environment:
      SCALAR_DB_HOSTNAME: staging-db.invalid
      SCALAR_LDAP_EMAIL_DOMAIN: example.edu
      SCALAR_LDAP_OBJECT_CLASS: person
    volumes:
      - ./test.sh:/test.sh:ro
      - ./ldap-auth.php:/ldap-auth.php:ro
      - ./asset-paths.php:/asset-paths.php:ro
      - ./mcrypt.php:/mcrypt.php:ro
      - ./rdf-hostname.php:/rdf-hostname.php:ro
      - ./rdfa-optional-fields.php:/rdfa-optional-fields.php:ro
      - ./arc2-xml.php:/arc2-xml.php:ro
      - ./dashboard-book-id.php:/dashboard-book-id.php:ro
    command: [/test.sh]
