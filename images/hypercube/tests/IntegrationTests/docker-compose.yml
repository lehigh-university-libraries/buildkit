# file: docker-compose.yml
#
# Tests the following:
# - Hypercube starts.
# - Can perform OCR on images and PDFs using Tesseract.
---
name: hypercube-integrationtests
services:
  # Serve test files over HTTP
  nginx:
    image: nginx:stable-alpine
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/test-image.jpg"]
      interval: 1s
      timeout: 3s
      retries: 30
      start_period: 1s
    volumes:
      - ./fixtures:/usr/share/nginx/html
  hypercube:
    image: ${HYPERCUBE:-lehighlts/hypercube:local}
    depends_on:
      nginx:
        condition: service_healthy
    environment:
      JWT_ADMIN_TOKEN: test_token
    volumes:
      - ./fixtures:/fixtures # Mount fixtures for POST requests
      - ./test.sh:/test.sh # Test to run.
    command:
      - /test.sh # Run test and exit.
