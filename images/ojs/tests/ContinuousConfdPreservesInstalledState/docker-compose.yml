---
name: ojs-continuousconfdpreservesinstalledstate
services:
  ojs:
    image: ${OJS:-lehighlts/ojs:local-php83}
    environment:
      CONFD_ENABLE_SERVICE: "true"
      CONFD_POLLING_INTERVAL: 1
      DB_HOST: database
      DB_PASSWORD: 'p"a\ss''word&+='
      OJS_SALT: test-salt
      OJS_API_KEY_SECRET: test-api-key-secret
      OJS_SECRET_KEY: base64:MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
      OJS_ADMIN_PASSWORD: 'Adm&in+=p@ss'
    command:
      - /bin/bash
      - -c
      - |
        set -euo pipefail
        for attempt in $$(seq 1 300); do
          if [ -f /installed ] && grep -qx 'installed = On' /var/www/ojs/config.inc.php; then
            break
          fi
          sleep 1
        done
        test -f /installed
        grep -qx 'installed = On' /var/www/ojs/config.inc.php
        test "$$(cat /var/run/s6/container_environment/OJS_INSTALLED)" = On
        test "$$(stat -c '%a' /var/run/s6/container_environment/OJS_INSTALLED)" = 600
        test "$$(stat -c '%a' /var/www/ojs/config.inc.php)" = 640
        curl -fsS http://localhost/status | grep -q pool
        curl -fsSI http://localhost/ >/dev/null
        for attempt in $$(seq 1 10); do
          sleep 1
          grep -qx 'installed = On' /var/www/ojs/config.inc.php
        done
    depends_on:
      mariadb:
        condition: service_healthy
  mariadb:
    image: ${MARIADB11:-lehighlts/mariadb:local-11}
    environment:
      DB_ROOT_PASSWORD: root
      DB_NAME: ojs
      DB_USER: ojs
      DB_PASSWORD: 'p"a\ss''word&+='
    networks:
      default:
        aliases:
          - database
