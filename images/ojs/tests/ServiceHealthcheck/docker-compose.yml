name: ojs-servicehealthcheck
services:
  ojs:
    image: ${OJS:-lehighlts/ojs:local-php83}
    environment:
      DB_HOST: database
      DB_PASSWORD: 'p"a\ss''word&+='
      OJS_SALT: test-salt
      OJS_API_KEY_SECRET: test-api-key-secret
      OJS_SECRET_KEY: base64:MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
      OJS_ADMIN_PASSWORD: 'Adm&in+=p@ss'
    depends_on:
      mariadb:
