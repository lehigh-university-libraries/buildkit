name: Template contracts

on:
  pull_request:
    paths:
      - ".github/workflows/template-contracts.yml"
      - "cmd/buildkit/**"
      - "internal/buildkit/template_test_runner*"
      - "internal/buildkit/template_workflow_contract_test.go"
      - "go.mod"
      - "go.sum"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/template-contracts.yml"
      - "cmd/buildkit/**"
      - "internal/buildkit/template_test_runner*"
      - "internal/buildkit/template_workflow_contract_test.go"
      - "go.mod"
      - "go.sum"
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:
    inputs:
      smoke:
        description: Run each template's retained smoke test after contract checks
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  templates:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout buildkit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: buildkit

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: buildkit/go.mod

      - name: Checkout Compose templates
        shell: bash
        run: |
          set -euo pipefail
          for repository in archivesspace drupal isle ojs omeka-classic omeka-s wp; do
            git clone --depth 1 "https://github.com/libops/${repository}.git" "templates/${repository}"
            commit="$(git -C "templates/${repository}" rev-parse HEAD)"
            printf -- '- `%s`: `%s`\n' "${repository}" "${commit}" >> "${GITHUB_STEP_SUMMARY}"
          done

      - name: Check contracts and image pins
        working-directory: buildkit
        run: >-
          go run ./cmd/buildkit template-test --check-only
          --root ../templates/archivesspace --root ../templates/drupal
          --root ../templates/isle --root ../templates/ojs
          --root ../templates/omeka-classic --root ../templates/omeka-s
          --root ../templates/wp

      - name: Run template smoke tests
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.smoke) }}
        working-directory: buildkit
        run: >-
          go run ./cmd/buildkit template-test --keep-going
          --root ../templates/archivesspace --root ../templates/drupal
          --root ../templates/isle --root ../templates/ojs
          --root ../templates/omeka-classic --root ../templates/omeka-s
          --root ../templates/wp
