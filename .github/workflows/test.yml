name: Test Docker Image

on:
  workflow_call:
    inputs:
      repository:
        required: true
        type: string
      image:
        required: true
        type: string
      fallback-tag:
        required: true
        type: string
      version-tags:
        required: false
        type: boolean
        default: false
      build-images:
        description: "JSON list of images available under the fallback tag"
        required: false
        type: string
        default: "[]"

jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Test
        run: |
          set -euo pipefail

          MODE="fallback"
          if [ "${{ inputs.version-tags }}" = "true" ]; then
            MODE="version"
          fi

          go run ./cmd/buildkit test \
            --image "${{ inputs.image }}" \
            --repository "${{ inputs.repository }}" \
            --mode "$MODE" \
            --tag "${{ inputs.fallback-tag }}" \
            --build-images-json '${{ inputs.build-images }}' \
            --pull
