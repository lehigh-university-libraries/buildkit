name: Test Docker Image

on:
  workflow_call:
    inputs:
      repository:
        required: true
        type: string
      image:
        required: true
        type: string
      fallback-tag:
        required: true
        type: string
      version-tags:
        required: false
        type: boolean
        default: false
      build-images:
        description: "JSON list of images available under the fallback tag"
        required: false
        type: string
        default: "[]"

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: "actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803" # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - name: Test
        run: |
          set -euo pipefail

          MODE="fallback"
          if [ "${{ inputs.version-tags }}" = "true" ]; then
            MODE="version"
          fi

          go run ./cmd/buildkit test \
            --image "${{ inputs.image }}" \
            --repository "${{ inputs.repository }}" \
            --mode "$MODE" \
            --tag "${{ inputs.fallback-tag }}" \
            --build-images-json '${{ inputs.build-images }}' \
            --pull
