name: validate renovate.json

on:
  pull_request:
    paths:
      - "renovate.json5"
      - "images/**/Dockerfile"
      - "ci/tests/renovate-config.cjs"
      - ".github/workflows/validate-renovate.yml"

env:
  LOG_LEVEL: debug

jobs:
  renovate-config-validator:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check dependency extraction
        run: node ci/tests/renovate-config.cjs

      - run: |
          set -eou pipefail
          docker run \
            --env LOG_LEVEL \
            --rm \
            -v $(pwd):/usr/src/app \
            renovate/renovate renovate-config-validator renovate.json5
